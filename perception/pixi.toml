[workspace]
name = "underbot-perception"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
ros-jazzy-rclpy = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-std-msgs = "*"
pip = "*"
ros-jazzy-foxglove-msgs = ">=3.4.3,<4"
python-sounddevice = ">=0.5.6,<0.6"
ros-jazzy-rmw-cyclonedds-cpp = ">=2.2.3,<3"

[pypi-dependencies]
ultralytics = ">=8.4,<9"
opencv-python = ">=4.10,<5"
cv2-enumerate-cameras = ">=1.1,<2"
psycopg = { version = ">=3.2, <4", extras = ["binary"] }

[tasks]
cameras = "python camera_node.py --list"
camera = "python camera_node.py"
yolo = "python yolo_node.py"
start = "python start.py"
check = "python check_stream.py"
layout = "python build_layout.py"
stop = "python stop.py"
location = "python manual_location.py"
microphones = "python audio_node.py --list"
audio = "python audio_node.py"
audio-stop = "python audio_node.py --stop"
