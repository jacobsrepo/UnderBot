<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision & Voice Assistant</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-shell">
        
        <!-- Minimal Top Navigation -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-symbol"></div>
                <h1 class="brand-title">AURA <span class="brand-sub">VISION & VOICE</span></h1>
            </div>

            <div class="header-center">
                <div class="status-indicator online" id="connection-status">
                    <span class="status-dot"></span>
                    <span id="connection-label">Connected</span>
                </div>
                <div class="model-badge" id="active-model-badge">
                    <span class="badge-icon">🧠</span>
                    <span id="badge-model-name">Qwen2.5-VL 7B</span>
                </div>
            </div>

            <div class="header-actions">
                <button class="action-btn secondary" id="btn-scene-scan" title="Scan current visual surroundings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"></path></svg>
                    <span>Scan Scene</span>
                </button>
                <button class="action-btn icon" id="btn-open-settings" title="Settings & Provider Config">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="main-workspace">
            
            <!-- Left: Video Feed Area -->
            <section class="video-section">
                <div class="card video-card">
                    
                    <!-- Video Top Controls -->
                    <div class="video-toolbar">
                        <div class="source-toggle">
                            <button class="toggle-btn active" id="btn-source-browser" title="Use this device's camera">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                                <span>Browser Camera</span>
                            </button>
                            <button class="toggle-btn" id="btn-source-server" title="Use host PC camera (Camo/USB)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                                <span>Host Camera</span>
                            </button>
                        </div>

                        <div class="camera-select-wrap" id="server-cam-dropdown-wrap" style="display: none;">
                            <select id="server-camera-select" class="clean-select">
                                <option value="0">Camera 0</option>
                            </select>
                        </div>
                    </div>

                    <!-- Video Viewport -->
                    <div class="video-viewport">
                        <!-- Browser Local Video (Direct HTML5 Camera) -->
                        <video id="browser-video-element" autoplay playsinline muted></video>
                        <!-- Server Video Stream (Fallback) -->
                        <img id="server-stream-element" src="/api/camera/stream" alt="Camera Feed" style="display: none;" crossorigin="anonymous">
                        <canvas id="browser-frame-canvas" style="display: none;"></canvas>

                        <!-- Minimal Overlay Badges -->
                        <div class="viewport-overlay-top">
                            <span class="live-pill">LIVE</span>
                            <span class="fps-pill" id="viewport-resolution">1280 × 720</span>
                        </div>

                        <div class="viewport-overlay-bottom">
                            <button class="viewport-action-btn" id="btn-snap-inspect" title="Inspect current frame">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                                <span>Inspect Frame</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right: Interactive Conversation & Voice -->
            <section class="conversation-section">
                <div class="card conversation-card">
                    
                    <!-- Audio Wave Visualizer Header -->
                    <div class="visualizer-header">
                        <div class="visualizer-title-wrap">
                            <span class="visualizer-status" id="visualizer-status-text">Standby</span>
                        </div>
                        <canvas id="minimal-audio-canvas" width="400" height="32"></canvas>
                    </div>

                    <!-- Chat Timeline -->
                    <div class="chat-timeline" id="chat-timeline">
                        <div class="chat-message assistant-message">
                            <div class="message-meta">
                                <span class="message-sender">Assistant</span>
                                <span class="message-time">Now</span>
                            </div>
                            <div class="message-content">
                                Vision and voice cortex active. Hold the microphone button below or press <strong>Space</strong> to talk.
                            </div>
                        </div>
                    </div>

                    <!-- Processing State -->
                    <div class="thinking-state" id="thinking-state" style="display: none;">
                        <div class="pulse-dot"></div>
                        <span id="thinking-label">Analyzing visual feed...</span>
                    </div>

                    <!-- Bottom Dock -->
                    <div class="chat-dock">
                        <div class="dock-row">
                            <!-- Push-To-Talk Button -->
                            <button class="ptt-button" id="btn-ptt">
                                <div class="ptt-icon-wrap">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                                </div>
                                <span id="ptt-label">Hold to Speak</span>
                                <span class="key-badge">Space</span>
                            </button>
                        </div>

                        <!-- Text Input Row -->
                        <div class="input-row">
                            <input type="text" id="text-input-field" class="clean-input" placeholder="Type a message or ask what the camera sees..." autocomplete="off">
                            <button id="btn-send-message" class="send-button" title="Send message">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <!-- Minimal Settings Modal -->
        <div class="modal-backdrop" id="settings-modal" style="display: none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h2 class="modal-title">Settings & Configuration</h2>
                    <button class="modal-close-btn" id="btn-close-settings">✕</button>
                </div>
                
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Vision Provider</label>
                        <select id="config-provider-select" class="clean-select full">
                            <option value="auto">Auto (Ollama if running, else Local CV)</option>
                            <option value="ollama">Local Ollama (Qwen2.5-VL / LLaVA)</option>
                            <option value="cloud_api">Cloud Vision API (OpenAI / Gemini / Groq)</option>
                            <option value="local_cv">Local Computer Vision (100% Offline)</option>
                        </select>
                    </div>

                    <div class="form-group" id="group-ollama-model">
                        <label class="form-label">Ollama Model</label>
                        <input type="text" id="config-ollama-model" class="clean-input full" value="qwen2.5vl:7b" placeholder="e.g. qwen2.5vl:7b, qwen2.5vl:3b, moondream">
                    </div>

                    <div class="form-group" id="group-api-key" style="display: none;">
                        <label class="form-label">Vision API Key</label>
                        <input type="password" id="config-api-key" class="clean-input full" placeholder="sk-...">
                    </div>

                    <div class="form-group" id="group-api-base" style="display: none;">
                        <label class="form-label">API Base URL</label>
                        <input type="text" id="config-api-base" class="clean-input full" value="https://api.openai.com/v1" placeholder="https://api.openai.com/v1">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Assistant Voice</label>
                        <select id="config-voice-select" class="clean-select full">
                            <option value="guy">Guy (Male - Natural & Clear)</option>
                            <option value="christopher">Christopher (Male - Calm & Authoritative)</option>
                            <option value="eric">Eric (Male - Energetic)</option>
                            <option value="ryan">Ryan (Male - British Tech)</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="action-btn secondary" id="btn-cancel-settings">Cancel</button>
                    <button class="action-btn primary" id="btn-save-settings">Save Settings</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden audio element for TTS playback -->
    <audio id="tts-audio-element" preload="auto"></audio>

    <!-- Scripts -->
    <script src="/static/audio_visualizer.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
