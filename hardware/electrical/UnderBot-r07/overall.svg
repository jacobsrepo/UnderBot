<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#176782"/></marker></defs><rect width="1600" height="1260" fill="#f4f8fb"/><style>text{font-family:Arial;fill:#173b4c}.box{fill:white;stroke:#176782;stroke-width:2}.hold{fill:#fff0cc;stroke:#b37b00;stroke-width:2}.wire{fill:none;stroke:#176782;stroke-width:3;marker-end:url(#arr)}</style><text x="35" y="40" font-size="29">UNDERBOT • NOCO + T12 • SYSTEM CONNECTION MAP r07</text><text x="35" y="72" font-size="18">Review draft: power paths and data interfaces. Amber blocks need verification before wiring / fabrication.</text><rect x="35" y="110" width="350" height="125" rx="10" class="box"/><text x="50" y="138" font-size="21">NOCO GB70 — owned</text><text x="50" y="165" font-size="16">56 Wh • use 12V OUT accessory port</text><text x="50" y="188" font-size="16">Approved accessory cable</text><text x="50" y="211" font-size="16">No jump clamps; charge separately</text><rect x="440" y="110" width="700" height="125" rx="10" class="hold"/><text x="455" y="138" font-size="21">POWER-DISTRIBUTION PCB / HARNESS</text><text x="455" y="165" font-size="16">Main fuse + disconnect → separately fused branches</text><text x="455" y="188" font-size="16">Pi / depth camera / actuator / auxiliary outputs + ground returns</text><text x="455" y="211" font-size="16">Protection ratings, footprints and stop/reset circuit still on HOLD</text><polyline class="wire" points="385,172 440,172"/><rect x="35" y="300" width="350" height="125" rx="10" class="box"/><text x="50" y="328" font-size="21">PI POWER MODULE</text><text x="50" y="355" font-size="16">52Pi EP-0225: DC input 9–24V</text><text x="50" y="378" font-size="16">USB-C PD 5.15V / 5A</text><text x="50" y="401" font-size="16">Physical input plug check pending</text><polyline class="wire" points="790,235 790,265 210,265 210,300"/><rect x="430" y="300" width="350" height="125" rx="10" class="hold"/><text x="445" y="328" font-size="21">KINECT POWER</text><text x="445" y="355" font-size="16">12V conditioning + v2 PC adapter</text><text x="445" y="378" font-size="16">Check GB70 regulation and adapter</text><text x="445" y="401" font-size="16">Buck-boost only if qualification requires</text><polyline class="wire" points="790,235 790,265 605,265 605,300"/><rect x="825" y="300" width="350" height="125" rx="10" class="hold"/><text x="840" y="328" font-size="21">ARM POWER</text><text x="840" y="355" font-size="16">Hardwired stop + manual reset</text><text x="840" y="378" font-size="16">VIN6-24V board: internal 5V buck</text><text x="840" y="401" font-size="16">Confirm revision + block USB backfeed</text><polyline class="wire" points="790,235 790,265 1000,265 1000,300"/><rect x="1220" y="300" width="345" height="125" rx="10" class="hold"/><text x="1235" y="328" font-size="21">AUXILIARY POWER</text><text x="1235" y="355" font-size="16">5V rail: audio + pan/tilt</text><text x="1235" y="378" font-size="16">Stop must also interrupt pan/tilt</text><text x="1235" y="401" font-size="16">Converter current rating HOLD</text><polyline class="wire" points="790,235 790,265 1392,265 1392,300"/><rect x="35" y="490" width="350" height="145" rx="10" class="box"/><text x="50" y="518" font-size="21">RASPBERRY PI 5 — owned</text><text x="50" y="545" font-size="16">USB-C ← EP-0225 supplied cable</text><text x="50" y="568" font-size="16">USB3 → Kinect + existing SSD</text><text x="50" y="591" font-size="16">USB → arm + microphone</text><text x="50" y="614" font-size="16">CSI → existing Pi Camera 3</text><polyline class="wire" points="210,425 210,490"/><rect x="430" y="490" width="350" height="145" rx="10" class="box"/><text x="445" y="518" font-size="21">KINECT v2 — fixed mount</text><text x="445" y="545" font-size="16">Matching v2 PC adapter + USB3</text><text x="445" y="568" font-size="16">Power adapter label/polarity check</text><text x="445" y="591" font-size="16">Pi driver / USB bandwidth test</text><text x="445" y="614" font-size="16">Not mounted on MG90S bracket</text><polyline class="wire" points="605,425 605,490"/><polyline class="wire" points="385,562 430,562"/><rect x="825" y="490" width="350" height="145" rx="10" class="hold"/><text x="840" y="518" font-size="21">ADEEPT ADA031 — 1 kit</text><text x="840" y="545" font-size="16">6 servos + controller included</text><text x="840" y="568" font-size="16">Assemble and calibrate kit</text><text x="840" y="591" font-size="16">USB command interface to Pi</text><text x="840" y="614" font-size="16">6-24V VIN revision / USB VBUS check</text><polyline class="wire" points="1000,425 1000,490"/><rect x="1220" y="490" width="345" height="145" rx="10" class="box"/><text x="1235" y="518" font-size="21">EXISTING AUDIO / PAN-TILT</text><text x="1235" y="545" font-size="16">2 MAX98357A + 2 speakers</text><text x="1235" y="568" font-size="16">2 MG90S → light Pi camera only</text><text x="1235" y="591" font-size="16">I2S from Pi; PWM controller TBD</text><text x="1235" y="614" font-size="16">Do not power motors from Pi 3V3</text><polyline class="wire" points="1392,425 1392,490"/><rect x="35" y="710" width="745" height="150" rx="10" class="box"/><text x="50" y="738" font-size="21">SENSORS / SMALL CONNECTIONS</text><text x="50" y="765" font-size="16">Pi I2C (GPIO2/3) → body IMU + camera IMU at different addresses</text><text x="50" y="788" font-size="16">2 × ICM-20948 breakouts at 3.3V; exact carrier pin labels checked</text><text x="50" y="811" font-size="16">4 × VL53L1X: mux or XSHUT address assignment required</text><text x="50" y="834" font-size="16">Existing Uno available for pan/tilt; 5V/3.3V interface check</text><text x="50" y="857" font-size="16">Pi fan header → active cooler; SSD and microphone share USB budget</text><polyline class="wire" points="210,635 210,710"/><rect x="825" y="710" width="740" height="150" rx="10" class="hold"/><text x="840" y="738" font-size="21">T12 — INDEPENDENT OEM POWER</text><text x="840" y="765" font-size="16">Original 14.8V battery: 3.2Ah nominal / 3.0Ah rated</text><text x="840" y="788" font-size="16">OEM battery → original motor controller, wheels, LiDAR and sensors</text><text x="840" y="811" font-size="16">Original dock → OEM charge electronics; NO NOCO connection</text><text x="840" y="834" font-size="16">Pi control/LiDAR link and independent drive stop are unverified</text><text x="840" y="857" font-size="16">Keep suction/brushes off for planned load estimate</text><text x="35" y="916" font-size="18">DATA: Pi → arm over USB; Pi ↔ Kinect/SSD over USB3; Pi ↔ IMUs/ToF over I2C; Pi → camera over CSI.</text><text x="35" y="950" font-size="18">SEPARATE BATTERIES: do not join positive rails. Any signal-ground/interface connection must follow the final interface design.</text><text x="35" y="1000" font-size="22">WHAT IS FIXED</text><text x="35" y="1030" font-size="18">NOCO + T12 batteries • no new 6S pack/BMS/charger • Kinect v2 • Adeept kit • one arm initially</text><text x="35" y="1080" font-size="22">BEFORE PCB FABRICATION</text><text x="35" y="1110" font-size="18">Verify arm controller supply + peaks, Kinect adapter, NOCO output/shutdown, T12 control/stop, connector pinouts and protection.</text><text x="35" y="1140" font-size="18">This is a module-interconnection design. It does not authorize the amber circuits or specify finished PCB copper/footprints.</text><text x="35" y="1200" font-size="18">Hardware allocations EUR 564.69 + reserve EUR 35.31 = EUR 600.00. Allowances are not supplier quotes.</text></svg>